<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is what lets us paint into the iPhone notch/home-bar area -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0" />
    <meta name="theme-color" content="#07070c" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="R+S" />

    <!-- Installed-app metadata. iOS ignores SVG here, so these are real PNGs;
         see scripts/make-icons.mjs, which draws them from the accent colours. -->
    <link rel="manifest" href="/RplusS/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/RplusS/icon-180.png" />
    <title>RplusS</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
