<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="R+S">
  <!--
    The home-screen icon reduced to the one thing that survives 16px.

    "R+S" is legible on a home screen and mush in a browser tab, so the favicon
    keeps only the lit join — same plate, same violet-to-cyan, same idea, drawn
    at a size that can actually hold it.
  -->
  <defs>
    <radialGradient id="plate" cx="50%" cy="42%" r="72%">
      <stop offset="0%" stop-color="#1d1830" />
      <stop offset="100%" stop-color="#040407" />
    </radialGradient>
    <linearGradient id="join" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a84cff" />
      <stop offset="100%" stop-color="#33e6ff" />
    </linearGradient>
    <filter id="bloom" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="3.2" result="wide" />
      <feGaussianBlur stdDeviation="1.1" result="tight" />
      <feMerge>
        <feMergeNode in="wide" />
        <feMergeNode in="wide" />
        <feMergeNode in="tight" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#plate)" />
  <!-- A hairline of light on the top edge, so it reads as an object rather
       than a hole punched in the tab strip. -->
  <path d="M14 0.6h36" stroke="#7b7b96" stroke-width="1.2" stroke-linecap="round" opacity="0.55" />

  <g filter="url(#bloom)">
    <path
      d="M28.6 15h6.8v9.6H45v6.8h-9.6V41h-6.8v-9.6H19v-6.8h9.6z"
      fill="url(#join)"
    />
  </g>
</svg>
